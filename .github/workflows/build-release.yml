name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'version.json'
      - 'version_info.txt'
      - 'pyproject.toml'
      - 'natural_gas_main/**'
      - 'run_app.py'
      - 'hooks/**'
      - 'Natural Gas Prop Main*.spec'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools
          pip install CoolProp numpy pydantic customtkinter matplotlib fpdf2 pyaga8 packaging
          pip install neqsim
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build onedir
        shell: pwsh
        run: |
          pyinstaller "Natural Gas Prop Main.spec" --clean
          $dir = Get-ChildItem "dist\Natural Gas Prop Main v*" -Directory | Select-Object -First 1
          $zip = "dist\Natural-Gas-Prop-win64.zip"
          Compress-Archive -Path "$($dir.FullName)\*" -DestinationPath $zip -Force

      - name: Build onefile
        shell: pwsh
        run: |
          pyinstaller "Natural Gas Prop Main onefile.spec" --clean
          $exe = Get-ChildItem "dist\*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "dist\Natural Gas Prop.exe" -Force

      - name: Read version
        id: read_version
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload onedir
        uses: actions/upload-artifact@v4
        with:
          name: windows-onedir
          path: dist/Natural-Gas-Prop-win64.zip

      - name: Upload onefile
        uses: actions/upload-artifact@v4
        with:
          name: windows-onefile
          path: dist/Natural Gas Prop.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install wheel setuptools
          pip3 install CoolProp numpy pydantic customtkinter matplotlib fpdf2 pyaga8 packaging
          pip3 install neqsim
          pip3 install pyinstaller pyinstaller-hooks-contrib

      - name: Build macOS .app
        run: |
          pyinstaller "Natural Gas Prop Main.spec" --clean
          ls -la dist/

      - name: Create .dmg
        run: |
          APP_DIR=$(ls -d dist/*.app 2>/dev/null | head -1)
          if [ -n "$APP_DIR" ]; then
            DMG_NAME="dist/Natural-Gas-Prop.dmg"
            hdiutil create -volname "Natural Gas Prop" \
              -srcfolder "$APP_DIR" \
              -ov "$DMG_NAME"
            ls -la "$DMG_NAME"
          else
            echo "No .app found"
            ls -la dist/
          fi

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: warn

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'version bump')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Download windows-onedir
        uses: actions/download-artifact@v4
        with:
          name: windows-onedir
          path: dist

      - name: Download windows-onefile
        uses: actions/download-artifact@v4
        with:
          name: windows-onefile
          path: dist

      - name: Download macos-dmg
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: Rename assets
        run: |
          mkdir -p out
          VERSION="${{ needs.build-windows.outputs.version }}"
          # Windows
          cp "dist/Natural Gas Prop.exe" "out/Natural Gas Prop ${VERSION}.exe" 2>/dev/null || true
          cp dist/Natural-Gas-Prop-win64.zip "out/Natural Gas Prop ${VERSION} (Windows).zip" 2>/dev/null || true
          # macOS
          DMG=$(ls dist/*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "out/Natural Gas Prop ${VERSION}.dmg" 2>/dev/null || true
          fi
          ls -la out/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.version }}
          name: Natural Gas Prop ${{ needs.build-windows.outputs.version }}
          files: out/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
