name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'version.json'
      - 'version_info.txt'
      - 'pyproject.toml'
      - 'natural_gas_main/**'
      - 'run_app.py'
      - 'hooks/**'
      - 'Natural Gas Prop Main*.spec'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools
          pip install CoolProp numpy pydantic customtkinter matplotlib fpdf2 pyaga8 packaging
          pip install pyinstaller

      - name: Build onedir (folder)
        shell: pwsh
        run: |
          Write-Host "Building onedir..."
          pyinstaller "Natural Gas Prop Main.spec" --clean
          $dir = Get-ChildItem "dist\Natural Gas Prop Main v*" -Directory | Select-Object -First 1
          $zip = "dist\Natural-Gas-Prop-win64-folder.zip"
          Compress-Archive -Path "$($dir.FullName)\*" -DestinationPath $zip -Force
          Write-Host "Onedir built: $zip"

      - name: Build onefile (standalone)
        shell: pwsh
        run: |
          Write-Host "Building onefile..."
          pyinstaller "Natural Gas Prop Main onefile.spec" --clean
          $exe = Get-ChildItem "dist\*.exe" | Select-Object -First 1
          $dest = "dist\Natural Gas Prop Main onefile.exe"
          Copy-Item $exe.FullName $dest -Force
          Write-Host "Onefile built: $dest"

      - name: Read version
        id: read_version
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          Write-Host "Version: $v"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload onedir artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-onedir
          path: dist/Natural-Gas-Prop-win64-folder.zip
          if-no-files-found: error

      - name: Upload onefile artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-onefile
          path: dist/Natural Gas Prop Main onefile.exe
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'version bump')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Download onedir artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-onedir
          path: dist

      - name: Download onefile artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-onefile
          path: dist

      - name: List dist
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.version }}
          name: Natural Gas Prop ${{ needs.build-windows.outputs.version }}
          files: |
            dist/Natural Gas Prop Main onefile.exe
            dist/Natural-Gas-Prop-win64-folder.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
