name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build for (e.g. v1.6.0)'
        required: true
        default: 'v1.6.1'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
          echo "Tag version: $tag"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.py', '**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Remove NeqSim (no Java on CI)
        run: |
          pip uninstall -y neqsim jpype1 pandas pytz tzdata 2>$null

      - name: Run tests
        run: |
          pip install pytest pytest-timeout
          pytest tests/ --tb=short -x --timeout=60 -k "not ui and not neqsim" --ignore=tests/test_coverage_phase3_hard.py -p no:cacheprovider -o "addopts=-ra --strict-markers"

      - name: Build Windows onedir
        run: |
          pyinstaller "Natural Gas Prop Main.spec" --clean --noconfirm
          Get-ChildItem dist\ -Directory | ForEach-Object { Write-Output "Built folder: $($_.Name)" }

      - name: Zip output folder
        run: |
          $folder = Get-ChildItem dist\ -Directory | Select-Object -First 1
          $zipName = "Natural-Gas-Prop-${{ steps.get_version.outputs.VERSION }}-win64.zip"
          Compress-Archive -Path "$($folder.FullName)" -DestinationPath "dist\$zipName"
          Write-Output "Created: dist\$zipName"

      - name: Upload ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: dist/Natural-Gas-Prop-*.zip
