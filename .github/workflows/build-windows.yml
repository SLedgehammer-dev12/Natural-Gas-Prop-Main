name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build for (e.g. v1.6.0)'
        required: true
        default: 'v1.7.2'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
          echo "Tag version: $tag"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.py', '**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pyinstaller==6.11.1
          python -m pip check
          python -c "import numpy, matplotlib; print('NumPy:', numpy.__version__, numpy.__file__); print('Matplotlib:', matplotlib.__version__)"

      - name: Remove NeqSim (no Java JVM on CI)
        run: python -m pip uninstall -y neqsim 2>$null || true

      - name: Run tests
        run: |
          python -m pip install pytest pytest-timeout
          python -m pytest tests/ --tb=short -x --timeout=60 -k "not ui and not neqsim" --ignore=tests/test_coverage_phase3_hard.py -p no:cacheprovider -o "addopts=-ra --strict-markers"

      - name: Build Windows onedir (Folder mode)
        run: |
          python -m PyInstaller "Natural Gas Prop Main.spec" --clean --noconfirm
          $folder = Get-ChildItem -Directory dist/* | Where-Object { $_.Name -like "Natural Gas Prop Main*" } | Select-Object -First 1
          $zipName = "Natural-Gas-Prop-${{ steps.get_version.outputs.VERSION }}-win64-folder.zip"
          Compress-Archive -Path "$($folder.FullName)" -DestinationPath "dist\$zipName"
          Write-Output "Created: dist\$zipName"

      - name: Build Windows Portable Python Bundle
        run: |
          python scripts/build_portable_windows.py
          $zipName = "Natural-Gas-Prop-${{ steps.get_version.outputs.VERSION }}-win64-portable.zip"
          Compress-Archive -Path "dist\Natural-Gas-Prop-Portable" -DestinationPath "dist\$zipName"
          Write-Output "Created: dist\$zipName"

      - name: Upload ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          overwrite_files: true
          files: |
            dist/Natural-Gas-Prop-*-win64-folder.zip
            dist/Natural-Gas-Prop-*-win64-portable.zip
