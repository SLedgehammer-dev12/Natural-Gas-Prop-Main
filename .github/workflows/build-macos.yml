name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install CoolProp>=7.2.0,<8.0.0 numpy>=1.26.0,<2.0.0 packaging>=21.0
          pip install pydantic>=2.0.0 customtkinter>=5.2.2 matplotlib>=3.10.0
          pip install fpdf2>=2.8.0 pyaga8>=0.1.16
          pip install neqsim>=3.6.1 || true
          pip install pyinstaller pytest pytest-cov

      - name: Run tests (skip NeqSim - no Java JVM)
        run: pytest --ignore=tests/test_neqsim_calculator.py --ignore=tests/test_neqsim_calculator_edge.py -q

      - name: Build .app bundle
        run: pyinstaller "Natural Gas Prop Main.spec" --clean --noconfirm

      - name: Create .dmg
        run: |
          APP_DIR=$(ls -d dist/"Natural Gas Prop Main"*/ 2>/dev/null | head -1)
          if [ -d "$APP_DIR" ]; then
            VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'].lstrip('v'))")
            hdiutil create -volname "Natural Gas Prop" \
              -srcfolder "$APP_DIR" \
              -ov -format UDZO \
              "dist/Natural-Gas-Prop-v${VERSION}.dmg"
          else
            echo "::error::.app bundle not found"
            exit 1
          fi

      - name: Upload .dmg to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Natural-Gas-Prop-*.dmg
