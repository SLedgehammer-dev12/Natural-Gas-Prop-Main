[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-gas-prop-main"
version = "1.7.3"
description = "Termodinamik doğal gaz karışımı hesaplama uygulaması"
readme = "README.md"
license = { text = "Proprietary - Kompresör Pompa" }
requires-python = ">=3.10"
authors = [
    { name = "Kompresör Pompa" },
]
dependencies = [
    "CoolProp>=7.2.0,<8.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pydantic>=2.0.0",
    "customtkinter>=5.2.2",
    "matplotlib>=3.10.0",
    "fpdf2>=2.8.0",
    "pyaga8>=0.1.16",
    "packaging>=21.0",
    "neqsim>=3.6.1",
]

[project.scripts]
natural-gas-prop = "natural_gas_main.main:main"

[project.urls]
Repository = "https://github.com/SLedgehammer-dev12/Natural-Gas-Prop-Main"
Issues = "https://github.com/SLedgehammer-dev12/Natural-Gas-Prop-Main/issues"

[tool.setuptools.packages.find]
include = ["natural_gas_main", "natural_gas_main.*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=natural_gas_main --cov-report=term --cov-fail-under=70 --strict-markers -ra"
markers = [
    "slow: Yavaş testler (CoolProp bağımlı)",
    "integration: Entegrasyon testleri",
    "unit: Birim testleri",
    "ui: GUI testleri (headless'da skip)",
    "accuracy: Doğruluk validasyon testleri",
    "neqsim: NeqSim bağımlı testler",
]

[tool.coverage.run]
omit = [
    "natural_gas_main/ui/*",
    "natural_gas_main/main.py",
]


[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
